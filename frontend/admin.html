<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BusyBags Admin</title>
<style>body{font-family:sans-serif;margin:0;padding:10px;background:#f5f5f5} .top{background:#0f172a;color:#fff;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center} .card{background:#fff;padding:15px;border-radius:12px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)} input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} button{padding:12px 18px;border:none;border-radius:8px;font-weight:bold;cursor:pointer} .orange{background:#ff8c00;color:#fff;width:100%} .red{background:red;color:#fff} .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee} .item img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:#eee}</style></head>
<body>
<div class="top"><b>BUSYBAGS ADMIN</b><a href="/" style="color:#ff8c00;text-decoration:none">← Shop</a></div>

<div class="card">
<h3 style="margin:0 0 10px">+ Add New Product</h3>
<input id="pname" placeholder="Product Name e.g. Cozyleen Sofa Blue">
<input id="pprice" type="number" placeholder="Price in UGX e.g. 850000">
<select id="pcat"><option value="fashion">fashion</option><option value="bags">bags</option><option value="furniture">furniture</option><option value="phone">phone</option></select>
<input id="pimg" placeholder="Image Link https://images.unsplash.com/... Or leave empty">
<button class="orange" onclick="addProduct()">ADD PRODUCT</button>
<p style="font-size:12px;color:#666">Tip: For image, copy any Unsplash link or your own product photo link. If empty, default image will be used.</p>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 id="count" style="margin:0">Products (0)</h3><button class="orange" style="width:auto" onclick="loadProducts()">Refresh</button></div>
<div id="list"></div>
</div>

<script>
const API = location.origin.includes('localhost') ? 'http://localhost:10000' : '';
async function loadProducts(){
 const res = await fetch(`${API}/api/products`);
 const data = await res.json();
 document.getElementById('count').innerText = `Products (${data.length})`;
 document.getElementById('list').innerHTML = data.map(p=>`
  <div class="item">
   <img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400'">
   <div style="flex:1"><b>${p.name}</b><br><span style="color:#666">${p.price} UGX - ${p.cat}</span></div>
   <button class="red" onclick="delProduct(${p.id})">X</button>
  </div>
 `).join('');
}
async function addProduct(){
 const name=document.getElementById('pname').value;
 const price=document.getElementById('pprice').value;
 const cat=document.getElementById('pcat').value;
 let img=document.getElementById('pimg').value;
 if(!name||!price){alert('Enter name and price!');return;}
 if(!img) img='https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400';
 const res=await fetch(`${API}/api/products`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,cat,img})});
 if(res.ok){alert('Added!');document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pimg').value='';loadProducts();}
}
async function delProduct(id){
 if(!confirm('Delete this product?')) return;
 await fetch(`${API}/api/products/${id}`,{method:'DELETE'});
 loadProducts();
}
loadProducts();
</script>
</body></html>
