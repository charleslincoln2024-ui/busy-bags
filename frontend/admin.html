<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BusyBags Admin</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;padding:12px}.top{background:#0f172a;color:#fff;padding:14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:12px;padding:12px;margin-top:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}.p{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #eee}.p img{width:50px;height:50px;border-radius:8px;object-fit:cover}.x{background:red;color:#fff;border:none;width:36px;height:36px;border-radius:8px;font-weight:800;cursor:pointer}.btn{background:#ff8c00;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:800;cursor:pointer}</style></head><body>
<div class="top"><b>BUSYBAGS ADMIN</b><a href="/" style="color:#ff8c00;text-decoration:none">← Shop</a></div>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Products (<span id="pc">0</span>)</h3><button class="btn" onclick="loadProducts()">Refresh</button></div><div id="plist"></div></div>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>📦 Orders (<span id="oc">0</span>)</h3><button class="btn" onclick="loadOrders()">Refresh Orders</button></div><div id="olist" style="margin-top:10px"></div></div>

<script>
const API='https://busy-bags-1-backend.onrender.com/api';
async function loadProducts(){let r=await fetch(API+'/products');let d=await r.json();document.getElementById('pc').innerText=d.length;document.getElementById('plist').innerHTML=d.map(p=>`<div class="p"><img src="${p.img}"><div style="flex:1"><b>${p.name}</b><br><small>${p.price} UGX - ${p.cat}</small></div><button class="x" onclick="del(${p.id})">X</button></div>`).join('')}
async function loadOrders(){let r=await fetch(API+'/orders');let d=await r.json();document.getElementById('oc').innerText=d.length;document.getElementById('olist').innerHTML=d.map(o=>`<div style="border:1px solid #eee;border-radius:8px;padding:10px;margin-top:8px"><b>${o.name||'Customer'}</b> ${o.phone||''}<br>${o.product||o.products||''} - ${o.amount||''} UGX<br><small style="color:gray">${o.date?new Date(o.date).toLocaleString():'Just now'}</small><br><a href="https://wa.me/${(o.phone||'').replace(/[^0-9]/g,'')}?text=Hello ${o.name}, your BusyBags order ${o.product} is confirmed!" style="background:#25D366;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:6px;font-size:12px">WhatsApp Customer</a></div>`).reverse().join('')||'No orders yet'}
async function del(id){if(!confirm('Delete?'))return;await fetch(API+'/products/'+id,{method:'DELETE'}).catch(()=>alert('Delete not enabled in backend, remove manually'));loadProducts()}
loadProducts();loadOrders();
</script></body></html>
