<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - Busy Bags</title>
<style>body{font-family:sans-serif;padding:20px;max-width:400px;margin:auto}input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc}button{width:100%;padding:15px;background:gold;border:none;border-radius:8px;font-weight:bold}</style>
</head>
<body>
<div style="text-align:center;border:1px solid #eee;padding:20px;border-radius:12px"><h2>👜 Busy Bags Kampala</h2><p>Stylish Bag - UGX 180,000</p></div>
<input id="phone" placeholder="256771234567" value="256771234567">
<input id="name" placeholder="Your Name">
<button onclick="buy()">Pay with MoMo 0776879873 & Buy</button>
<p id="msg"></p>
<script>
async function buy(){
 const m=document.getElementById('msg'); m.innerHTML='Processing... Please wait 30 sec (backend waking)';
 try{
  const r=await fetch('https://busy-bags-1-backend.onrender.com/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value||'Customer',phone:document.getElementById('phone').value,transactionId:'TX'+Date.now(),product:'Stylish Bag',amount:180000})});
  const d=await r.json(); m.innerHTML='<span style="color:green">✅ Order Saved! We will call you!</span><br><a href="/admin.html">View Orders</a>';
 }catch(e){ m.innerHTML='❌ Failed to fetch - backend sleeping, wait 30 sec and Try Again'; }
}
</script>
</body>
</html>
