<!DOCTYPE html>
<html>
<head><title>Busy Bags - Pay with MoMo</title>
<style>
body{font-family:Arial;padding:20px;max-width:400px;margin:auto}
button{background:#FFCC00;color:black;padding:15px 30px;border:none;border-radius:10px;font-size:18px;font-weight:bold;width:100%;cursor:pointer}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.bag{border:1px solid #eee;padding:15px;border-radius:10px;margin-bottom:20px;text-align:center}
</style>
</head>
<body>
<div class="bag">
  <h2>👜 Busy Bags Kampala</h2>
  <p>Stylish Bag - UGX 180,000</p>
  <p><small>Delivery in Kampala</small></p>
</div>

<input id="phone" placeholder="MTN Number e.g. 256771234567" value="256771234567">
<input id="amount" value="100" type="hidden">
<button id="payBtn" onclick="pay()">Pay with MTN MoMo</button>
<p id="status"></p>

<script>
async function pay(){
  const btn = document.getElementById('payBtn');
  const status = document.getElementById('status');
  btn.innerText = "Sending request...";
  btn.disabled = true;
  
  try {
    const res = await fetch('http://localhost:3000/api/pay', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        phone: document.getElementById('phone').value,
        amount: "100",
        orderId: "BUSYBAG-" + Date.now()
      })
    });
    const data = await res.json();
    if(data.success){
      status.innerHTML = "✅ <b>Request sent!</b><br>Check MTN phone to enter PIN.<br>Ref: " + data.ref;
      status.style.color = "green";
      btn.innerText = "Paid! Check phone";
    } else {
      throw new Error(data.error);
    }
  } catch(e){
    status.innerText = "❌ Error: " + e.message;
    status.style.color = "red";
    btn.innerText = "Try Again";
    btn.disabled = false;
  }
}
</script>
</body>
</html>
