<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>BusyBags V2 - 7 Products</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.top{background:#ff9900;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:26px}b{color:#fff}span{color:#000}.cats{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff}.cat{border:1px solid #eee;padding:6px 14px;border-radius:20px;font-size:13px;background:#fff}.cat.active{background:#000;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.p{background:#fff;border-radius:8px;padding:8px}.p img{width:100%;height:120px;object-fit:cover;border-radius:6px;background:#eee}.pr{color:#ff6600;font-weight:bold}</style>
</head><body>
<div class="top"><div class="logo"><b>BUSY</b><span>BAGS</span> <small style="font-size:10px">V2-7PRODS</small></div><div>🛒<b id="cart">0</b></div></div>
<div class="cats"><span class="cat active" onclick="filterCat('all',this)">All (7)</span><span class="cat" onclick="filterCat('fashion',this)">Fashion (2)</span><span class="cat" onclick="filterCat('grocery',this)">Groceries</span><span class="cat" onclick="filterCat('phone',this)">Phones</span><span class="cat" onclick="filterCat('bags',this)">Bags</span></div>
<div id="grid" class="grid">Loading from backend...</div>
<script>
const API='https://busy-bags-1-backend.onrender.com/api';
let all=[];
async function load(){
 try{
  let r=await fetch(API+'/products?t='+Date.now());
  all=await r.json();
  console.log('Loaded',all.length); 
  render(all);
 }catch(e){document.getElementById('grid').innerHTML='Backend waking... retrying';setTimeout(load,3000)}
}
function render(list){
 document.getElementById('grid').innerHTML=list.map(p=>`
  <div class="p"><img src="${p.img}"><div style="font-size:12px;height:30px">${p.name}</div><div class="pr">${p.price.toLocaleString()} UGX</div><div style="font-size:10px;color:gray">${p.cat}</div><button style="width:100%;background:#ff9900;border:none;padding:8px;border-radius:4px;margin-top:4px;font-weight:bold" onclick="alert('Ordered '+p.name)">ADD TO CART</button></div>
 `).join('')+'<div style="grid-column:1/3;text-align:center;padding:10px;font-size:12px">Total: '+list.length+' products loaded from API at '+new Date().toLocaleTimeString()+'</div>';
}
function filterCat(c,el){
 document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');
 if(c=='all')render(all);else render(all.filter(p=>p.cat==c));
}
load();
</script>
</body></html>
