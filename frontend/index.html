<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BusyBags Uganda</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.top{background:#ff9900;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:26px}.cats{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;position:sticky;top:52px}.cat{border:1px solid #eee;padding:7px 16px;border-radius:20px;font-size:13px;background:#fff;white-space:nowrap}.cat.active{background:#000;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.p{background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 2px rgba(0,0,0,.1)}.p img{width:100%;height:130px;object-fit:cover;border-radius:8px}.pr{color:#ff6600;font-weight:bold;margin:4px 0}
.hero{margin:10px;background:linear-gradient(90deg,#0f172a,#334155);color:#fff;padding:18px;border-radius:12px}.hero y{color:#fbbf24}</style>
</head><body>
<div class="top"><div class="logo"><b style="color:#fff">BUSY</b><span style="color:#000">BAGS</span></div><div>👤 🛒<b id="cart">0</b></div></div>
<div class="cats"><span class="cat active" onclick="filterCat('all',this)">All</span><span class="cat" onclick="filterCat('fashion',this)">Fashion</span><span class="cat" onclick="filterCat('grocery',this)">Groceries</span><span class="cat" onclick="filterCat('phone',this)">Phones</span><span class="cat" onclick="filterCat('bags',this)">Bags</span></div>
<div class="hero"><h2>One busy bag <y>away.</y></h2><p style="font-size:13px;margin-top:4px">Groceries, Fashion, Phones, Bags - Fast delivery Uganda</p></div>
<div id="grid" class="grid">Loading...</div>
<script>
const API='https://busy-bags-1-backend.onrender.com/api';let all=[];
async function load(){let r=await fetch(API+'/products');all=await r.json();render(all)}
function render(list){document.getElementById('grid').innerHTML=list.map(p=>`<div class="p"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'"><div style="font-size:12px;font-weight:600;margin-top:6px;height:32px;overflow:hidden">${p.name}</div><div class="pr">${p.price.toLocaleString()} UGX</div><button style="width:100%;background:#ff9900;border:none;padding:9px;border-radius:6px;font-weight:bold;margin-top:6px" onclick="buy('${p.name}')">ADD TO CART</button></div>`).join('')||'No products'}
function filterCat(c,el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(c=='all')render(all);else render(all.filter(p=>p.cat==c))}
async function buy(n){let ph=prompt('MoMo number 256... for '+n+':');if(!ph)return;await fetch(API+'/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Customer',phone:ph,product:n,amount:all.find(x=>x.name==n)?.price||0})});alert('Order saved! We will call you')}
load();
</script>
</body></html>
